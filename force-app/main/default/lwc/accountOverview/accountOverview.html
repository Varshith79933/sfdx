<template>
    <lightning-card title="Account Overview" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <lightning-button
                variant="brand"
                label="Refresh"
                onclick={handleRefreshClick}>
            </lightning-button>
            <div class="slds-m-top_small slds-text-body_small">
                <p>Account Tier: Gold</p>
                <p>Region: North America</p>
                <p>Support Phone: +1-800-555-0100</p>
            </div>
        </div>

        <template if:true={contacts}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <p class="slds-text-title_bold">Contacts</p>
                <template for:each={contacts} for:item="con">
                    <p key={con.Id}>{con.Name} - {con.Phone} - {con.Description}</p>
                </template>
            </div>
        </template>

        <template if:true={opportunities}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <p class="slds-text-title_bold">Closed Won Opportunities</p>
                <template for:each={opportunities} for:item="opp">
                    <p key={opp.Id}>{opp.Name} - {opp.Amount}</p>
                </template>
            </div>
        </template>

        <template if:true={cases}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <p class="slds-text-title_bold">Open Cases</p>
                <template for:each={cases} for:item="cas">
                    <p key={cas.Id}>{cas.Subject} - {cas.Priority} - {cas.Status}</p>
                </template>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>{error}</p>
            </div>
        </template>
    </lightning-card>
</template>
